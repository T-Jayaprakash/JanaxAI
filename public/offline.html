<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Offline — JANUXAI</title>
<style>
  html,body{height:100%;margin:0;background:#0a0a0a;color:#f5f5f5;font:16px/1.5 system-ui,-apple-system,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 4px}
  p{color:#a3a3a3;margin:0 0 20px}
  button{background:#f5f5f5;color:#0a0a0a;border:0;border-radius:999px;padding:10px 20px;font:inherit;font-weight:600}
</style>
</head>
<body>
<main>
  <div>
    <img src="/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Your videos keep rendering on our servers.<br>Reconnect to see them.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
